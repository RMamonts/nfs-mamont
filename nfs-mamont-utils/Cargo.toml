[package]
name = "nfs-mamont-utils"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Ready-made building blocks for nfs-mamont servers: pool buffer allocator, MOUNT v3 and NLM v4 service implementations"
publish = true
license = "MIT"
readme = "../README.md"
repository = "https://github.com/RMamonts/nfs-mamont"
keywords = ["nfs", "nfsv3", "async", "server"]
categories = ["network-programming", "filesystem"]
rust-version.workspace = true

[features]
default = []
mlock = ["dep:libc"]

[dependencies]
# Internal crates
nfs-mamont.workspace = true

# External dependencies
crossbeam-queue.workspace = true
libc = { version = "0.2.186", optional = true }
tokio.workspace = true
tracing.workspace = true
