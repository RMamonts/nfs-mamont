[workspace]
members = ["nfs-mamont", "nfs-mamont-utils"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Rmamonts"]
rust-version = "1.75.0"

[workspace.dependencies]
# Internal crates
nfs-mamont = { path = "nfs-mamont", version = "0.2.0" }

# External dependencies
async-channel = "2.3.0"
byteorder = "1.5.0"
crossbeam-queue = "0.3.12"
num-derive = "0.4.2"
num-traits = "0.2.19"
tokio = { version = "1.51", features = ["rt", "net", "io-util", "sync", "time", "macros", "signal"] }
tracing = "0.1"
trait-variant = "0.1.2"
