[workspace]
members = ["drr-channel", "nfs-mamont", "nfs-mamont-util"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["Rmamonts"]
rust-version = "1.75.0"

[workspace.dependencies]
# Internal crates
drr-channel = { path = "drr-channel", version = "0.3.0" }
nfs-mamont = { path = "nfs-mamont", version = "0.3.0" }

# External dependencies
async-channel = "2.3.0"
byteorder = "1.5.0"
crossbeam-queue = "0.3.12"
libc = "0.2.186"
num-derive = "0.4.2"
num-traits = "0.2.19"
tokio = { version = "1.51", default-features = false }
tracing = "0.1"
trait-variant = "0.1.2"
