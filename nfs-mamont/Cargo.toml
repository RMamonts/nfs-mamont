[package]
name = "nfs-mamont"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "An asynchronous NFS server library: complete MOUNT and NFSv3 stack with a pluggable VFS backend, built on tokio with a hand-written RPC/XDR layer"
publish = false
license = "MIT"
readme = "../README.md"
repository = "https://github.com/RMamonts/nfs-mamont"
keywords = ["nfs", "nfsv3", "async", "server", "rpc", "xdr", "mount"]
categories = ["network-programming", "filesystem"]
rust-version.workspace = true

[lib]
doctest = true

[features]
default = []
mlock = ["dep:libc"]

[dependencies]
# External dependencies
tokio.workspace = true
byteorder.workspace = true
num-derive.workspace = true
num-traits.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-channel.workspace = true
crossbeam-queue.workspace = true
trait-variant.workspace = true
libc = { version = "0.2.186", optional = true }
