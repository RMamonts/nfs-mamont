[package]
name = "nfs-mamont"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "A Rust NFS Server library"
publish = false
rust-version.workspace = true

[lib]
doctest = true

[features]
default = []
mlock = ["dep:libc"]

[dependencies]
# External dependencies
tokio.workspace = true
byteorder.workspace = true
num-derive.workspace = true
num-traits.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-channel.workspace = true
crossbeam-queue.workspace = true
trait-variant.workspace = true
libc = { version = "0.2.186", optional = true }

[target.'cfg(kani_ra)'.dependencies]
kani = { git = "https://github.com/model-checking/kani" }

[lints.rust]
# `cfg(kani)` is set only by `cargo kani`; declare it so ordinary builds do not
# warn about the `#[cfg(kani)]` proof harnesses.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
