name: Kani

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Kani (${{ matrix.harnesses }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # One job per harness module, run in parallel: a failing job names the
        # module, and a harness that runs out of memory or time does not hide
        # the results of the others. `--harness` matches by substring.
        harnesses:
          - parser::proofs::primitive
          - parser::proofs::rpc
          - parser::proofs::nlm
          - parser::proofs::parser_struct
          - parser::read_buffer::proofs
          - service::nlm::proofs::ranges
          - service::nlm::proofs::merge
          - allocator::proofs
          - serializer::server::serialize_struct::proofs

    steps:
      - uses: actions/checkout@v7

      - name: Verify harnesses
        uses: model-checking/kani-github-action@v1
        with:
          kani-version: "0.68.0"
          args: -p nfs-mamont --harness ${{ matrix.harnesses }} --output-format terse
