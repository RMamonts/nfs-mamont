name: Formal Verification

# Kani model-checks the XDR padding formula on both the parser and serializer
# side, and the NLM interval arithmetic. The proofs are unbounded, so the whole
# job --- CBMC install included --- runs in about a minute.
#
# Deliberately not scoped by `paths`: a filter would silently skip a `#[cfg(kani)]`
# module added outside the listed directories, and a proof that never runs looks
# exactly like a proof that passed. Running everything on every PR also leaves this
# job safe to mark as a required status check.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  kani:
    name: Kani Proof Harnesses
    runs-on: ubuntu-latest
    # A CBMC run that blows past this is a proof whose bounds need revisiting,
    # not a job worth leaving to the 6-hour default.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      # Pinned: CBMC updates change solving times, and an unpinned bump would
      # surface as an unexplained timeout on an unrelated PR.
      - uses: model-checking/kani-github-action@v1
        with:
          kani-version: "0.67.0"
          args: "-p nfs-mamont"
