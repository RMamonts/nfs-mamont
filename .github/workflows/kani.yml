name: Formal Verification

# Kani model-checks the synchronous parsing, allocation, serialization and NLM
# range cores. It is scoped to those paths because a full run installs CBMC and
# takes several minutes, and nothing outside them is reachable from a proof
# harness. Add a path here whenever a `#[cfg(kani)]` module lands outside them.
on:
  pull_request:
    branches: ["main"]
    paths:
      - "nfs-mamont/src/parser/**"
      - "nfs-mamont/src/allocator/**"
      - "nfs-mamont/src/serializer/**"
      - "nfs-mamont/src/service/**"
      - "nfs-mamont/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/kani.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  kani:
    name: Kani Proof Harnesses
    runs-on: ubuntu-latest
    # A CBMC run that blows past this is a proof whose bounds need revisiting,
    # not a job worth leaving to the 6-hour default.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      # Pinned: CBMC updates change solving times, and an unpinned bump would
      # surface as an unexplained timeout on an unrelated PR.
      - uses: model-checking/kani-github-action@v1
        with:
          kani-version: "0.67.0"
          args: "-p nfs-mamont"
