name: Rust CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check Cargo.lock is up to date
        run: cargo check --locked

  test:
    name: Build and Test
    needs: [lint]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ["1.75.0", "1.99.0"]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (${{ matrix.rust }})
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}
          cache-on-failure: true

      # installed before build for better cache

      # TODO: uncomment after there will be more than one test suite
      # nextest is faster than default cargo test
      # - name: Install cargo-nextest
      #   run: cargo install cargo-nextest --locked

      - name: Build
        run: cargo build --verbose --all-features

      - name: Run tests
        run: cargo test --verbose --all-features
        # TODO: uncomment after there will be more than one test suite
        # and delete line above
        # run: cargo nextest run --verbose --all-features

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        run: cargo audit

  docs:
    name: Build Documentation
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build documentation
        run: cargo doc --all-features --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: target/doc/
          retention-days: 7

  kani-modules:
    name: Kani Modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.modules.outputs.modules }}
    steps:
      - uses: actions/checkout@v7

      - name: Collect top-level crate modules
        id: modules
        run: |
          modules=$(sed -nE 's/^(pub(\([^)]*\))? +)?mod +([a-z0-9_]+);.*/\3/p' nfs-mamont/src/lib.rs | jq -Rnc '[inputs]')
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

  kani:
    name: Kani Autoharness (${{ matrix.module }})
    needs: [lint, kani-modules]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.kani-modules.outputs.modules) }}
        # everything outside top-level modules: crate root, trait impls for foreign types
        include:
          - module: other
    steps:
      - uses: actions/checkout@v7

      # Kani matches functions as `nfs_mamont::<path>`; `<?` also covers `<module::Type as Trait>::method`
      - name: Build function filter
        id: filter
        env:
          MODULE: ${{ matrix.module }}
          MODULES: ${{ join(fromJSON(needs.kani-modules.outputs.modules), '|') }}
        run: |
          if [ "$MODULE" = other ]; then
            echo "args=--exclude-pattern '^nfs_mamont::<?($MODULES)::'" >> "$GITHUB_OUTPUT"
          else
            echo "args=--include-pattern '^nfs_mamont::<?$MODULE::'" >> "$GITHUB_OUTPUT"
          fi

      # 0.68.0 panics on `catch_unwind` intrinsic: https://github.com/model-checking/kani/issues/4813
      - name: Run Kani autoharness
        uses: model-checking/kani-github-action@v1.1
        with:
          kani-version: "0.67.0"
          args: autoharness -Z autoharness ${{ steps.filter.outputs.args }}

  udeps:
    name: Check Unused Dependencies
    needs: [security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install cargo-udeps
        run: cargo install --locked cargo-udeps

      - name: Run cargo-udeps
        run: cargo +nightly udeps --all-targets
