name: Publish to crates.io

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: {}

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    # Restricted to v* tags; tag creation is limited to org admins by ruleset.
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches crate version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "nfs-mamont") | .version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag $TAG does not match crate version v$version"
            exit 1
          fi

      - name: Dry run
        run: cargo publish -p nfs-mamont --locked --dry-run

      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        run: cargo publish -p nfs-mamont --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
