name: Publish to crates.io

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: {}

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    # The environment only accepts v* tags; tag creation is limited to org admins by ruleset.
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # drr-channel is versioned on its own and is not tied to the release tag.
      - name: Check tag matches crate version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for crate in nfs-mamont nfs-mamont-util; do
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg name "$crate" '.packages[] | select(.name == $name) | .version')
            if [ "$TAG" != "v$version" ]; then
              echo "::error::release tag $TAG does not match $crate version v$version"
              exit 1
            fi
          done

      # Packages and builds every crate before anything is uploaded; dependent crates are
      # verified against the local, not yet published versions of their dependencies.
      - name: Dry run
        run: cargo publish --workspace --locked --dry-run

      # Skips drr-channel when its version has not changed since the last release, and makes
      # a re-run after a partial failure publish only the remaining crates.
      - name: Select unpublished crates
        id: select
        run: |
          for crate in drr-channel nfs-mamont nfs-mamont-util; do
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg name "$crate" '.packages[] | select(.name == $name) | .version')
            curl -sf -A nfs-mamont-release "https://crates.io/api/v1/crates/$crate/$version" >/dev/null \
              || packages="$packages -p $crate"
          done
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

      - name: Authenticate with crates.io
        if: steps.select.outputs.packages != ''
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # Publishes in dependency order and waits for each crate to appear in the index.
      - name: Publish
        if: steps.select.outputs.packages != ''
        # PACKAGES is intentionally unquoted: it holds several `-p <crate>` arguments.
        run: cargo publish --locked $PACKAGES
        env:
          PACKAGES: ${{ steps.select.outputs.packages }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
