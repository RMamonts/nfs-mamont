name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# A new push to the same PR cancels the review still running for the old commit.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review
    # Skip drafts and PRs from forks (secrets are not available to them).
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run Claude review
        uses: anthropics/claude-code-action@v1
        with:
          # Only one of these secrets needs to be set.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request to nfs-mamont, an NFS server
            library written in Rust. Specs for the wire protocols are in
            rfc/ (NFSv3/v4, ONC RPC in rfc/rpc, XDR in rfc/xdr).

            Read the diff with `gh pr diff` and the surrounding code as needed.
            Focus, in order of priority, on:
            - correctness bugs and protocol violations (XDR encoding/decoding,
              padding, discriminants, error codes, RPC semantics vs. the RFCs);
            - panics, unchecked arithmetic or indexing on untrusted input,
              unbounded allocations driven by client data;
            - concurrency issues, lock misuse, blocking calls in async code;
            - missing or wrong tests for the changed behaviour;
            - public API breakage in the nfs-mamont crate.
            You may run `cargo clippy --all-targets --all-features` and
            `cargo test` to confirm a suspicion.

            Do not comment on formatting or style that rustfmt/clippy already
            enforce, and do not restate what the PR does.

            Post each concrete issue as an inline comment on the relevant line
            with mcp__github_inline_comment__create_inline_comment.
            Then post one short summary with `gh pr comment`: overall verdict
            and the most important issues. If nothing significant is found,
            say so in one line.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(cargo clippy:*),Bash(cargo test:*),Bash(cargo check:*)"
