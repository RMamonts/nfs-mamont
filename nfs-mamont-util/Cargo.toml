[package]
name = "nfs-mamont-util"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Ready-made building blocks for nfs-mamont servers: pool buffer allocator, MOUNT v3 and NLM v4 service implementations"
publish = true
license = "MIT"
readme = "../README.md"
repository = "https://github.com/RMamonts/nfs-mamont"
keywords = ["nfs", "nfsv3", "async", "server"]
categories = ["network-programming", "filesystem"]
rust-version.workspace = true

[features]
default = []
mlock = ["dep:libc"]
metrics = ["dep:metrics"]

[dependencies]
# Internal crates
nfs-mamont.workspace = true

# External dependencies
crossbeam-queue.workspace = true
libc = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
metrics = { version = "0.24.6", optional = true }

[dev-dependencies]
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
tokio = { workspace = true, features = ["rt", "macros", "time"] }
