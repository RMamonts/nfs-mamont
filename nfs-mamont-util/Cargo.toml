[package]
name = "nfs-mamont-util"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Ready-made building blocks for nfs-mamont servers: pool buffer allocator, MOUNT v3 and NLM v4 service implementations"
publish = true
license = "MIT"
readme = "../README.md"
repository = "https://github.com/RMamonts/nfs-mamont"
keywords = ["nfs", "nfsv3", "nlm", "mount", "buffer-pool"]
categories = ["network-programming", "filesystem", "memory-management"]
rust-version.workspace = true

[features]
default = []
mlock = ["dep:libc"]

[dependencies]
# Internal crates
nfs-mamont.workspace = true

# External dependencies
crossbeam-queue.workspace = true
libc = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time"] }
