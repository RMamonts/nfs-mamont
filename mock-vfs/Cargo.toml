[package]
name = "mock-vfs"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "In-memory mock VFS backend and benchmark tools for nfs-mamont"
publish = false

[dependencies]
nfs-mamont = { path = "../nfs-mamont", features = ["metrics"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing-subscriber.workspace = true
metrics-exporter-prometheus = { version = "0.18.3", features = ["protobuf"] }
tokio-metrics = { version = "0.5.2", features = ["metrics-rs-integration"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.186"
